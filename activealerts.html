<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SP SafeRoute - Active Alerts</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Professional UI/UX Overhaul for Active Alerts */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-hover: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --nav-hover: rgba(0, 0, 0, 0.05);
      --page-bg: #f8fafc;
      --modal-bg: #ffffff;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
      --card-hover-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);

      /* Colors */
      --danger: #ef4444;
      --crime: #8b5cf6;
      --hazard: #f59e0b;
      --primary: #3b82f6;
    }

    [data-theme="dark"] {
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-hover: rgba(30, 41, 59, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --nav-hover: rgba(255, 255, 255, 0.1);
      --page-bg: #0b0f19;
      --modal-bg: #1e293b;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --card-hover-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-y: auto;
    }

    body {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      padding-top: 80px;
      background: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Container */
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-back:hover {
      background: var(--nav-hover);
      transform: translateX(-2px);
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-btn:hover {
      background: var(--nav-hover);
      transform: rotate(15deg);
    }

    /* Layout for Cards */
    .alerts-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* Premium Alert Cards */
    .alert-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .alert-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--card-color, #ccc);
    }

    .alert-card:hover {
      transform: translateY(-6px);
      background: var(--glass-hover);
      box-shadow: var(--card-hover-shadow);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Dynamic Color Mappings */
    .alert-card.type-accident {
      --card-color: var(--danger);
    }

    .alert-card.type-crime {
      --card-color: var(--crime);
    }

    .alert-card.type-hazard {
      --card-color: var(--hazard);
    }

    .alert-type {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] .alert-type {
      background: rgba(255, 255, 255, 0.05);
    }

    .alert-desc {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.6;
      font-weight: 500;
      flex-grow: 1;
    }

    .alert-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
      padding-top: 16px;
      margin-top: auto;
    }

    .alert-location {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 65%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alert-image {
      margin-top: 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
      height: 140px;
      background: rgba(0, 0, 0, 0.02);
    }

    .alert-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .alert-card:hover .alert-image img {
      transform: scale(1.05);
    }

    /* Glassmorphic Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 28px;
      padding: 32px;
      position: relative;
      color: var(--text-main);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95) translateY(20px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--nav-hover);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--danger);
      color: white;
    }

    .modal-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 24px;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .modal-text {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 500;
    }

    .modal-button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      margin-top: 32px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .modal-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(59, 130, 246, 0.4);
    }

    .modal-button.close {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      margin-top: 12px;
      box-shadow: none;
    }

    .modal-button.close:hover {
      background: var(--nav-hover);
    }

    .modal-image {
      margin: 20px 0;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.03);
      max-height: 300px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }

    /* Loading/Empty States */
    .loading-state,
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 500;
      grid-column: 1 / -1;
    }

    .error-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--danger);
      font-size: 18px;
      font-weight: 500;
      grid-column: 1 / -1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    @media (max-width: 600px) {
      .alerts-container {
        padding: 0 16px;
        grid-template-columns: 1fr;
      }

      .alert-card {
        padding: 20px;
      }

      .modal-content {
        padding: 24px;
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="fixed-header">
    <div class="header-left">
      <button class="btn-back" onclick="location.href='index.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <h2 style="margin:0; font-size: 20px; color: var(--text-main);">Active Alerts</h2>
    </div>
    <div id="themeToggleBtn" class="control-btn" title="Toggle Theme">🌗</div>
  </div>

  <div id="alertsList" class="alerts-container">
    <div class="loading-state">Loading alerts...</div>
  </div>

  <div id="incidentModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <div id="modalType" style="font-weight: 700; font-size: 20px; margin-bottom: 8px;"></div>

      <div id="modalImage" class="modal-image" style="display: none;"></div>

      <div class="modal-label">Description</div>
      <div id="modalDesc" class="modal-text"></div>

      <div class="modal-label">Location</div>
      <div id="modalLocation" class="modal-text"></div>

      <div class="modal-label">Reported At</div>
      <div id="modalDate" class="modal-text" style="color: var(--text-muted); font-size: 14px;"></div>

      <button id="viewLocationBtn" class="modal-button">📍 View Live Location</button>
      <button id="closeModalBtn2" class="modal-button close">Close</button>
    </div>
  </div>

  <script>
    let TOKEN = localStorage.getItem('token');
    if (!TOKEN) location.href = 'index.html';

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      loadAlerts();
    });

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      if (newTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', newTheme);
    });

    function formatDate(ts) {
      if (!ts) return 'Unknown date';
      try {
        return new Date(ts).toLocaleString(undefined, {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return 'Invalid date';
      }
    }

    // Helper function to properly format image URL
    // FIXED: Now looks for image_url from the database
    function getImageUrl(imageData) {
      if (!imageData) return null;

      // If it's already a data URL
      if (imageData.startsWith('data:image')) {
        return imageData;
      }

      // If it's base64 without prefix
      if (typeof imageData === 'string' && imageData.length > 100) {
        // Try to detect if it's base64
        try {
          // Check if it looks like base64 (no spaces, alphanumeric +/+=)
          if (/^[A-Za-z0-9+/=]+$/.test(imageData.substring(0, 100))) {
            return `data:image/jpeg;base64,${imageData}`;
          }
        } catch (e) { }
      }

      return null;
    }

    const modal = document.getElementById('incidentModal');
    let currentLocation = null;

    function closeModal() {
      modal.classList.remove('active');
    }

    function openModal(incident) {
      const typeColors = {
        accident: '#ef4444',
        crime: '#8b5cf6',
        hazard: '#f59e0b'
      };
      const color = typeColors[incident.type] || '#6b7280';
      const status = (incident.status || '').toLowerCase();
      const isResolved = ['completed', 'resolved', 'dismissed'].includes(status);
      document.getElementById('modalType').innerHTML = `<span style="color:${color}">${incident.type.toUpperCase()}</span>`;
      document.getElementById('modalDesc').innerText = incident.description || 'No description provided';
      document.getElementById('modalLocation').innerText = incident.location_name || `${incident.lat?.toFixed(4) || 'Unknown'}, ${incident.lng?.toFixed(4) || 'Unknown'}`;
      document.getElementById('modalDate').innerText = formatDate(incident.created_at);

      // FIXED: Use image_url instead of image
      const modalImageDiv = document.getElementById('modalImage');
      const imageUrl = getImageUrl(incident.image_url);

      if (imageUrl) {
        modalImageDiv.style.display = 'block';
        modalImageDiv.innerHTML = `<img src="${imageUrl}" alt="Incident evidence" onerror="this.parentElement.style.display='none'">`;
      } else {
        modalImageDiv.style.display = 'none';
        modalImageDiv.innerHTML = '';
      }

      currentLocation = { lat: incident.lat, lng: incident.lng };
      modal.classList.add('active');
    }

    document.getElementById('viewLocationBtn').addEventListener('click', () => {
      if (currentLocation && currentLocation.lat && currentLocation.lng) {
        window.open(`https://www.google.com/maps?q=${currentLocation.lat},${currentLocation.lng}`, '_blank');
      } else {
        alert('Location coordinates not available');
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn2').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    async function loadAlerts() {
      const container = document.getElementById('alertsList');

      try {
        const res = await fetch('/incidents/', {
          headers: { 'Authorization': `Bearer ${TOKEN}` }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const incidents = await res.json();

        // Active Alerts: only show truly active (pending) incidents — not resolved/completed/deleted
        const RESOLVED_STATUSES = ['completed', 'resolved', 'dismissed', 'deleted'];
        const visibleIncidents = (incidents || []).filter(inc => !RESOLVED_STATUSES.includes((inc.status || '').toLowerCase()));

        if (visibleIncidents.length === 0) {
          container.innerHTML = '<div class="empty-state">✅ No active alerts right now. Stay safe!</div>';
          return;
        }

        // Sort newest first
        visibleIncidents.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        container.innerHTML = '';

        visibleIncidents.forEach(inc => {
          const status = (inc.status || '').toLowerCase();
          const typeColors = {
            accident: '#ef4444',
            crime: '#8b5cf6',
            hazard: '#f59e0b'
          };
          const color = typeColors[inc.type] || '#6b7280';

          const card = document.createElement('div');
          card.className = `alert-card type-${inc.type}`;

          // FIXED: Use image_url instead of image for thumbnail
          let imageHtml = '';
          const imageUrl = getImageUrl(inc.image_url);
          if (imageUrl) {
            imageHtml = `
            <div class="alert-image">
              <img src="${imageUrl}" alt="Incident evidence" onerror="this.parentElement.style.display='none'">
            </div>
          `;
          }

          const description = inc.description || 'No description';
          const truncatedDesc = description.length > 100 ? description.substring(0, 100) + '...' : description;
          const locationText = inc.location_name ?
            (inc.location_name.length > 25 ? inc.location_name.substring(0, 25) + '...' : inc.location_name) :
            `${inc.lat?.toFixed(4) || 'Unknown'}, ${inc.lng?.toFixed(4) || 'Unknown'}`;

          card.innerHTML = `
          <div class="alert-type" style="color:${color}">${inc.type.toUpperCase()}</div>
          <div class="alert-desc">${escapeHtml(truncatedDesc)}</div>
          <div class="alert-meta">
            <span>📍 ${escapeHtml(locationText)}</span>
            <span>${formatDate(inc.created_at)}</span>
          </div>
          ${imageHtml}
        `;

          card.addEventListener('click', () => openModal(inc));
          container.appendChild(card);
        });

      } catch (err) {
        console.error('Error loading alerts:', err);
        container.innerHTML = '<div class="error-state">⚠️ Error loading alerts. Please try again later.</div>';
      }
    }

    // Simple escape function to prevent XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
<!-- Generic Alert Modal -->
<div id="genericAlertModal" class="sidebar-overlay" style="z-index: 9999; align-items: center; justify-content: center; display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(5px);">
    <div class="glass-card" style="width: 90%; max-width: 400px; margin: 0; position: relative; background: var(--glass-bg, #fff); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
        <button onclick="document.getElementById('genericAlertModal').style.display='none'" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted, #666);">&times;</button>
        <h3 id="genericAlertTitle" style="color: var(--text-main, #333); margin-top: 0; margin-bottom: 10px; font-family: sans-serif;">Alert</h3>
        <p id="genericAlertBody" style="color: var(--text-muted, #666); font-size: 15px; line-height: 1.5; margin-bottom: 20px; white-space: pre-wrap; font-family: sans-serif;"></p>
        <button onclick="document.getElementById('genericAlertModal').style.display='none'" style="background: var(--primary, #3b82f6); color: white; padding: 12px; border-radius: 20px; width: 100%; font-weight: 600; cursor: pointer; border: none; font-size: 15px;">OK</button>
    </div>
</div>
<script>
window.alert = function(message, title = "Notification") {
    document.getElementById('genericAlertTitle').innerText = title;
    document.getElementById('genericAlertBody').innerText = message;
    document.getElementById('genericAlertModal').style.display = 'flex';
};
</script>
</body>

</html>
