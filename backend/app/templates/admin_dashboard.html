<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SafeRoute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar .nav-link { color: #ecf0f1; }
        .sidebar .nav-link:hover { background: #34495e; }
        .incident-row:hover { background: #f8f9fa; }
        .badge-accident { background: #e74c3c; }
        .badge-hazard { background: #f39c12; }
        .badge-crime { background: #2c3e50; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 p-0 sidebar">
            <div class="p-3">
                <h4 class="text-white">SafeRoute Admin</h4>
                <hr class="bg-light">
            </div>
            <nav class="nav flex-column">
                <a class="nav-link active" href="#" onclick="showSection('incidents')">📋 Incidents</a>
                <a class="nav-link" href="#" onclick="showSection('analytics')">📊 Analytics</a>
                <a class="nav-link text-danger" href="#" onclick="logout()">🚪 Logout</a>
            </nav>
        </div>
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Admin Dashboard</h2>
                <div>Welcome, {{ user.email }}</div>
            </div>
            <div id="incidentsSection">
                <div class="card">
                    <div class="card-header">All Incidents</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr><th>ID</th><th>Type</th><th>Location</th><th>Description</th><th>User ID</th><th>Status</th><th>Reported</th><th>Actions</th></tr>
                                </thead>
                                <tbody id="incidentsList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div id="analyticsSection" style="display:none;">
                <div class="row">
                    <div class="col-md-6"><div class="card"><div class="card-header">Monthly Trends</div><div class="card-body"><canvas id="monthlyChart"></canvas></div></div></div>
                    <div class="col-md-6"><div class="card"><div class="card-header">Most Prone Areas</div><div class="card-body"><canvas id="areaChart"></canvas></div></div></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
// Get token from localStorage (same key as in index.html)
const token = localStorage.getItem('token');
if (!token) {
    // Not logged in – redirect to login page
    window.location.href = '/';
}

// Helper function for authenticated fetch
async function authFetch(url, options = {}) {
    options.headers = {
        ...options.headers,
        'Authorization': `Bearer ${token}`
    };
    const response = await fetch(url, options);
    if (response.status === 401) {
        // Token expired or invalid – redirect to login
        localStorage.removeItem('token');
        window.location.href = '/';
        throw new Error('Not authenticated');
    }
    return response;
}

function showSection(section) {
    document.getElementById('incidentsSection').style.display = section === 'incidents' ? 'block' : 'none';
    document.getElementById('analyticsSection').style.display = section === 'analytics' ? 'block' : 'none';
    if (section === 'incidents') loadIncidents();
    if (section === 'analytics') loadAnalytics();
}

async function loadIncidents() {
    try {
        const res = await authFetch('/admin/incidents');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const incidents = await res.json();
        const tbody = document.getElementById('incidentsList');
        tbody.innerHTML = '';
        if (incidents.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No incidents found</td></tr>';
            return;
        }
        incidents.forEach(inc => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = inc.id;
            row.insertCell(1).innerHTML = `<span class="badge badge-${inc.type}">${inc.type}</span>`;
            row.insertCell(2).textContent = inc.location_name || `${inc.lat},${inc.lng}`;
            row.insertCell(3).textContent = inc.description?.substring(0, 50) || '';
            row.insertCell(4).textContent = inc.user_id;
            row.insertCell(5).innerHTML = `<span class="badge bg-${inc.status === 'completed' ? 'success' : 'warning'}">${inc.status}</span>`;
            row.insertCell(6).textContent = new Date(inc.created_at).toLocaleString();
            const actions = row.insertCell(7);
            if (inc.status !== 'completed') {
                const completeBtn = document.createElement('button');
                completeBtn.textContent = 'Complete & Notify';
                completeBtn.className = 'btn btn-sm btn-success me-2';
                completeBtn.onclick = () => completeIncident(inc.id);
                actions.appendChild(completeBtn);
            }
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'btn btn-sm btn-danger';
            deleteBtn.onclick = () => deleteIncident(inc.id);
            actions.appendChild(deleteBtn);
        });
    } catch (err) {
        console.error('Failed to load incidents:', err);
        document.getElementById('incidentsList').innerHTML = '<tr><td colspan="8" class="text-danger">Failed to load incidents</td></tr>';
    }
}

async function completeIncident(id) {
    if (!confirm('Mark as completed and notify user?')) return;
    try {
        const res = await authFetch(`/admin/incidents/${id}/complete`, { method: 'POST' });
        if (res.ok) {
            alert('Completed & user notified');
            loadIncidents();
        } else {
            alert('Failed to complete incident');
        }
    } catch (err) {
        alert('Error: ' + err.message);
    }
}

async function deleteIncident(id) {
    if (!confirm('Delete permanently?')) return;
    try {
        const res = await authFetch(`/admin/incidents/${id}`, { method: 'DELETE' });
        if (res.ok) {
            loadIncidents();
        } else {
            alert('Delete failed');
        }
    } catch (err) {
        alert('Error: ' + err.message);
    }
}

async function loadAnalytics() {
    try {
        const res = await authFetch('/admin/analytics');
        if (!res.ok) throw new Error('Analytics fetch failed');
        const data = await res.json();
        new Chart(document.getElementById('monthlyChart'), {
            type: 'line',
            data: {
                labels: data.monthly_stats.map(m => m.month),
                datasets: [{ label: 'Incidents', data: data.monthly_stats.map(m => m.count), borderColor: '#667eea' }]
            }
        });
        new Chart(document.getElementById('areaChart'), {
            type: 'bar',
            data: {
                labels: data.area_stats.map(a => a.area),
                datasets: [{ label: 'Incidents', data: data.area_stats.map(a => a.count), backgroundColor: '#764ba2' }]
            }
        });
    } catch (err) {
        console.error('Analytics error:', err);
    }
}

function logout() {
    localStorage.removeItem('token');
    window.location.href = '/';
}

// Attach logout button
document.getElementById('logoutBtn')?.addEventListener('click', logout);

// Initial load
showSection('incidents');
</script>
</body>
</html>
