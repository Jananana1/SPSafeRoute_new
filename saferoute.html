<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP SafeRoute - Safe Route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui; }
    .header { padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 16px; }
    .btn-back { background: none; border: none; font-size: 24px; cursor: pointer; color: #1A73E8; }
    h2 { margin: 0; font-size: 20px; }
    .container { padding: 12px; background: #f3f4f6; }
    .input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
    .btn { padding: 12px; background: #1A73E8; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; width: 100%; }
    .suggestions-list { background: white; border: 1px solid #ccc; border-radius: 12px; margin-bottom: 12px; max-height: 200px; overflow-y: auto; }
    .suggestion-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    .suggestion-item:hover { background: #f0f0f0; }
    #routeMap { height: 400px; width: 100%; background: #e0e0e0; margin-bottom: 10px; }
    .message { text-align: center; color: #dc2626; margin-top: 8px; }
    .info { text-align: center; color: #1A73E8; margin-top: 4px; font-size: 12px; padding: 0 4px; }
    .route-buttons { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 10px; }
    .route-buttons button { flex:1; background:#e5e7eb; color:#1f2937; border:none; padding:10px; border-radius:12px; font-weight:bold; cursor:pointer; }
    .route-buttons button.active { background:#1A73E8; color:white; }
    .route-buttons button.safest.active { background:#10b981; color:white; }
    .route-buttons button.dangerous.active { background:#dc2626; color:white; }
    .route-buttons button:disabled { opacity:0.4; cursor:not-allowed; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .nav-buttons button { flex:1; background:#6b7280; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold; cursor:pointer; }
    .nav-buttons button.start { background:#10b981; }
    .nav-buttons button.stop { background:#dc2626; }
    .nav-buttons button:disabled { opacity:0.4; cursor:not-allowed; }
    .legend { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    .debug-console { font-size: 10px; color: gray; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
<div class="header">
  <button class="btn-back" onclick="location.href='index.html'">←</button>
  <h2>Safe Route</h2>
</div>
<div class="container">
  <input type="text" id="destinationSearch" placeholder="Destination in San Pablo City" class="input">
  <div id="destSuggestions" class="suggestions-list"></div>
  <button id="findRouteBtn" class="btn">Find Route</button>

  <div id="routeButtonsContainer" class="route-buttons" style="display: none;">
    <button id="safestBtn" class="safest">🛡️ Safest</button>
    <button id="moderateBtn">⚖️ Moderate</button>
    <button id="dangerousBtn" class="dangerous">⚠️ Dangerous</button>
  </div>

  <div id="navButtonsContainer" class="nav-buttons" style="display: none;">
    <button id="startNavBtn" class="start">▶ Start Navigation</button>
    <button id="stopNavBtn" class="stop" disabled>⏹ Stop Navigation</button>
  </div>

  <div id="locationStatus" class="message"></div>
  <div id="infoMsg" class="info"></div>
  <div class="legend" id="legend" style="display:none;">
    <div class="legend-item"><div class="legend-dot" style="background:#10b981;"></div> Safest (0 incidents)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1A73E8;"></div> Moderate</div>
    <div class="legend-item"><div class="legend-dot" style="background:#dc2626;"></div> Dangerous</div>
    <div class="legend-item"><div class="legend-dot" style="background:#dc2626; border-radius:2px;"></div> Incident near dest</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b; border-radius:2px;"></div> Incident along route</div>
  </div>
</div>
<div id="routeMap"></div>
<div class="debug-console">Check browser console (F12) for route details</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let TOKEN = localStorage.getItem('token');
  if (!TOKEN) location.href = 'index.html';

  const CITY_BOUNDS = { south: 14.0400, west: 121.2000, north: 14.1100, east: 121.3800 };
  const CITY_CENTER = { lat: 14.0700, lng: 121.3255 };
  const DEST_INCIDENT_RADIUS = 300;
  const ROUTE_INCIDENT_RADIUS = 250;
  const SAMPLE_STEP = 50;

  let routeMap, selectedDest, destSearchTimeout, allRoutes = [], activeRouteIndex = 0, startLocation;
  let incidentsData = [], incidentMarkers = [], currentRoutePolyline, userMarker, locationWatcher, isNavigating = false;

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function getIncidentCoords(inc) {
    return (inc && inc.lat != null && inc.lng != null) ? { lat: parseFloat(inc.lat), lng: parseFloat(inc.lng) } : null;
  }

  function sampleRoutePoints(coords, stepMeters = SAMPLE_STEP) {
    const points = [];
    for (let i = 1; i < coords.length; i++) {
      const p1 = coords[i-1], p2 = coords[i];
      const segLen = getDistance(p1.lat, p1.lng, p2.lat, p2.lng);
      const steps = Math.max(1, Math.ceil(segLen / stepMeters));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        points.push({ lat: p1.lat + (p2.lat-p1.lat)*t, lng: p1.lng + (p2.lng-p1.lng)*t });
      }
    }
    return points;
  }

  function scoreRoute(coords, destLat, destLng) {
    const incidents = incidentsData.map(getIncidentCoords).filter(Boolean);
    if (incidents.length === 0) return { totalIncidents: 0, routeLengthKm: 0 };
    const nearDest = new Set();
    incidents.forEach((ic, idx) => {
      if (getDistance(ic.lat, ic.lng, destLat, destLng) <= DEST_INCIDENT_RADIUS) nearDest.add(idx);
    });
    const alongRoute = new Set();
    const samples = sampleRoutePoints(coords);
    for (const pt of samples) {
      incidents.forEach((ic, idx) => {
        if (!nearDest.has(idx) && !alongRoute.has(idx) && getDistance(pt.lat, pt.lng, ic.lat, ic.lng) <= ROUTE_INCIDENT_RADIUS)
          alongRoute.add(idx);
      });
    }
    let len = 0;
    for (let i=1; i<coords.length; i++) len += getDistance(coords[i-1].lat, coords[i-1].lng, coords[i].lat, coords[i].lng);
    return { totalIncidents: nearDest.size + alongRoute.size, routeLengthKm: len/1000 };
  }

  async function fetchIncidents() {
    try {
      const res = await fetch('/incidents/', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
      if (!res.ok) throw new Error();
      incidentsData = await res.json();
      console.log(`✅ Loaded ${incidentsData.length} incidents`);
    } catch(e) { incidentsData = []; console.warn("Incidents failed"); }
  }

  // Fetch route from OSRM and also generate additional variations if only 1 route returned
  async function fetchRouteAlternatives(start, dest) {
    const baseUrl = `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${dest.lng},${dest.lat}?alternatives=true&overview=full&geometries=geojson`;
    try {
      const res = await fetch(baseUrl);
      const data = await res.json();
      if (data.code !== 'Ok' || !data.routes?.length) return null;
      let routes = data.routes.map((r, idx) => {
        const coords = r.geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));
        const metrics = scoreRoute(coords, dest.lat, dest.lng);
        return { id: idx, coords, duration: r.duration, distance: r.distance, ...metrics };
      });
      console.log(`OSRM returned ${routes.length} route(s)`);
      
      // If only 1 route, generate additional alternatives by adding waypoints
      if (routes.length === 1) {
        console.log("Only 1 route found, generating alternative routes via waypoints...");
        const extraRoutes = await generateAlternativeRoutes(start, dest);
        routes = [...routes, ...extraRoutes];
      }
      return routes;
    } catch(e) { console.error(e); return null; }
  }

  // Generate alternative routes by inserting a waypoint offset from the direct line
  async function generateAlternativeRoutes(start, dest) {
    const alternatives = [];
    // Create 2 waypoints: one slightly north-east, one slightly south-west of midpoint
    const midLat = (start.lat + dest.lat) / 2;
    const midLng = (start.lng + dest.lng) / 2;
    const offsets = [
      { lat: midLat + 0.008, lng: midLng + 0.008 }, // NE
      { lat: midLat - 0.008, lng: midLng - 0.008 }, // SW
      { lat: midLat + 0.005, lng: midLng - 0.005 }, // SE
    ];
    for (let i = 0; i < offsets.length; i++) {
      const via = offsets[i];
      const url = `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${via.lng},${via.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length) {
          const r = data.routes[0];
          const coords = r.geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));
          const metrics = scoreRoute(coords, dest.lat, dest.lng);
          alternatives.push({ id: `via${i}`, coords, duration: r.duration, distance: r.distance, ...metrics });
        }
      } catch(e) {}
    }
    console.log(`Generated ${alternatives.length} additional routes via waypoints`);
    return alternatives;
  }

  function classifyRoutes(routes) {
    if (!routes.length) return { safest: null, moderate: null, dangerous: null };
    const zero = routes.filter(r => r.totalIncidents === 0);
    const one = routes.filter(r => r.totalIncidents === 1);
    const twoPlus = routes.filter(r => r.totalIncidents >= 2);
    const shortest = (arr) => arr.length ? arr.reduce((a,b) => a.distance < b.distance ? a : b) : null;
    return { safest: shortest(zero), moderate: shortest(one), dangerous: shortest(twoPlus) };
  }

  function initRouteMap() {
    if (routeMap) routeMap.remove();
    routeMap = L.map('routeMap').setView([CITY_CENTER.lat, CITY_CENTER.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(routeMap);
    const loose = { south: CITY_BOUNDS.south-0.08, west: CITY_BOUNDS.west-0.08, north: CITY_BOUNDS.north+0.08, east: CITY_BOUNDS.east+0.08 };
    routeMap.setMaxBounds([[loose.south, loose.west], [loose.north, loose.east]]);
    routeMap.dragging.enable();
  }

  function clearIncidentMarkers() { incidentMarkers.forEach(m => routeMap.removeLayer(m)); incidentMarkers = []; }
  
  function drawIncidentMarkers(route, destLat, destLng) {
    clearIncidentMarkers();
    const incidents = incidentsData.map(getIncidentCoords).filter(Boolean);
    incidents.forEach((ic, idx) => {
      const inc = incidentsData[idx];
      if (getDistance(ic.lat, ic.lng, destLat, destLng) <= DEST_INCIDENT_RADIUS) {
        const m = L.circleMarker([ic.lat, ic.lng], { radius:9, color:'#dc2626', fillColor:'#dc2626', fillOpacity:0.9 })
          .addTo(routeMap).bindPopup(`<b>⚠ Near destination</b><br>${inc.type || 'Incident'}`);
        incidentMarkers.push(m);
        return;
      }
      const samples = sampleRoutePoints(route.coords);
      for (const pt of samples) {
        if (getDistance(pt.lat, pt.lng, ic.lat, ic.lng) <= ROUTE_INCIDENT_RADIUS) {
          const m = L.circleMarker([ic.lat, ic.lng], { radius:7, color:'#f59e0b', fillColor:'#fbbf24', fillOpacity:0.85 })
            .addTo(routeMap).bindPopup(`<b>⚠ Along route</b><br>${inc.type || 'Incident'}`);
          incidentMarkers.push(m);
          break;
        }
      }
    });
  }

  function displayRoute(route, startLat, startLng, destLat, destLng, color) {
    if (currentRoutePolyline) routeMap.removeLayer(currentRoutePolyline);
    routeMap.eachLayer(layer => { if (layer instanceof L.Marker && layer !== userMarker) routeMap.removeLayer(layer); });
    currentRoutePolyline = L.polyline(route.coords.map(c=>[c.lat,c.lng]), { color, weight:6, opacity:0.85 }).addTo(routeMap);
    L.marker([startLat, startLng]).addTo(routeMap).bindPopup('Start');
    L.marker([destLat, destLng]).addTo(routeMap).bindPopup('Destination');
    drawIncidentMarkers(route, destLat, destLng);
    if (isNavigating && userMarker) userMarker.addTo(routeMap);
    if (currentRoutePolyline.getBounds().isValid()) routeMap.fitBounds(currentRoutePolyline.getBounds(), { padding: [30,30] });
  }

  function setupRouteButtons(routes, startLoc, destLoc) {
    const safestBtn = document.getElementById('safestBtn'), moderateBtn = document.getElementById('moderateBtn'), dangerousBtn = document.getElementById('dangerousBtn');
    const routeDiv = document.getElementById('routeButtonsContainer'), infoDiv = document.getElementById('infoMsg'), legendDiv = document.getElementById('legend');
    if (!routes?.length) { routeDiv.style.display = 'none'; infoDiv.innerText = 'No routes found.'; return; }
    const { safest, moderate, dangerous } = classifyRoutes(routes);
    allRoutes = [safest, moderate, dangerous];
    safestBtn.disabled = !safest; moderateBtn.disabled = !moderate; dangerousBtn.disabled = !dangerous;
    if (safest) safestBtn.textContent = `🛡️ Safest (0 incidents)`;
    if (moderate) moderateBtn.textContent = `⚖️ Moderate (1 incident)`;
    if (dangerous) dangerousBtn.textContent = `⚠️ Dangerous (${dangerous.totalIncidents} incidents)`;
    let defaultIdx = -1, defaultRoute = null, defaultColor = '', defaultBtn = null;
    if (safest) { defaultIdx=0; defaultRoute=safest; defaultColor='#10b981'; defaultBtn=safestBtn; }
    else if (moderate) { defaultIdx=1; defaultRoute=moderate; defaultColor='#1A73E8'; defaultBtn=moderateBtn; }
    else if (dangerous) { defaultIdx=2; defaultRoute=dangerous; defaultColor='#dc2626'; defaultBtn=dangerousBtn; }
    [safestBtn, moderateBtn, dangerousBtn].forEach(btn => btn.classList.remove('active'));
    if (defaultRoute) { activeRouteIndex=defaultIdx; displayRoute(defaultRoute, startLoc.lat, startLoc.lng, destLoc.lat, destLoc.lng, defaultColor); defaultBtn.classList.add('active'); }
    infoDiv.innerText = `${routes.length} route(s). Safest: ${safest?.totalIncidents??'N/A'} incidents, Dangerous: ${dangerous?.totalIncidents??'N/A'} incidents.`;
    routeDiv.style.display = 'flex'; legendDiv.style.display = 'flex';
    const switchTo = (idx, color, btn) => { if (allRoutes[idx]) { [safestBtn, moderateBtn, dangerousBtn].forEach(b=>b.classList.remove('active')); btn.classList.add('active'); displayRoute(allRoutes[idx], startLoc.lat, startLoc.lng, destLoc.lat, destLoc.lng, color); } };
    safestBtn.onclick = () => { if (!safestBtn.disabled) switchTo(0, '#10b981', safestBtn); };
    moderateBtn.onclick = () => { if (!moderateBtn.disabled) switchTo(1, '#1A73E8', moderateBtn); };
    dangerousBtn.onclick = () => { if (!dangerousBtn.disabled) switchTo(2, '#dc2626', dangerousBtn); };
  }

  async function searchLocation(query) {
    const vb = `${CITY_BOUNDS.west},${CITY_BOUNDS.south},${CITY_BOUNDS.east},${CITY_BOUNDS.north}`;
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=10&viewbox=${vb}&bounded=1`;
    try {
      const res = await fetch(url, { headers: { 'User-Agent': 'SP-SafeRoute/1.0' } });
      const data = await res.json();
      return data.filter(i => { const lat=parseFloat(i.lat), lng=parseFloat(i.lon); return lat>=CITY_BOUNDS.south && lat<=CITY_BOUNDS.north && lng>=CITY_BOUNDS.west && lng<=CITY_BOUNDS.east; });
    } catch(e) { return []; }
  }

  function startNavigation() {
    if (!navigator.geolocation || isNavigating) return;
    isNavigating = true;
    userMarker = L.marker([startLocation.lat, startLocation.lng], { icon: L.divIcon({ html:'🧍', iconSize:[22,22] }) }).addTo(routeMap);
    locationWatcher = navigator.geolocation.watchPosition(pos => { startLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; userMarker.setLatLng([startLocation.lat, startLocation.lng]); routeMap.panTo([startLocation.lat, startLocation.lng]); }, err=>{}, { enableHighAccuracy:true, maximumAge:5000, timeout:10000 });
    document.getElementById('startNavBtn').disabled = true; document.getElementById('stopNavBtn').disabled = false;
  }
  function stopNavigation() {
    if (locationWatcher) { navigator.geolocation.clearWatch(locationWatcher); locationWatcher = null; }
    isNavigating = false; if (userMarker) { routeMap.removeLayer(userMarker); userMarker = null; }
    if (currentRoutePolyline) routeMap.fitBounds(currentRoutePolyline.getBounds());
    document.getElementById('startNavBtn').disabled = false; document.getElementById('stopNavBtn').disabled = true;
  }

  async function findRoute() {
    if (!selectedDest) { alert('Select destination from suggestions'); return; }
    if (!navigator.geolocation) { alert('Geolocation not supported'); return; }
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.innerText = 'Getting location...';
    document.getElementById('routeButtonsContainer').style.display = 'none';
    document.getElementById('navButtonsContainer').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
    navigator.geolocation.getCurrentPosition(async pos => {
      startLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      statusDiv.innerText = 'Fetching routes & incidents...';
      await fetchIncidents();
      const routes = await fetchRouteAlternatives(startLocation, selectedDest);
      if (routes?.length) {
        statusDiv.innerText = '';
        setupRouteButtons(routes, startLocation, selectedDest);
        document.getElementById('navButtonsContainer').style.display = 'flex';
        document.getElementById('startNavBtn').disabled = false;
        document.getElementById('stopNavBtn').disabled = true;
        document.getElementById('startNavBtn').onclick = startNavigation;
        document.getElementById('stopNavBtn').onclick = stopNavigation;
      } else { statusDiv.innerText = 'No routes found. Try different destination.'; }
    }, err => { const msgs = {1:'Permission denied',2:'Unavailable',3:'Timeout'}; statusDiv.innerText = msgs[err.code] || 'Location error'; });
  }

  document.addEventListener('DOMContentLoaded', () => {
    initRouteMap();
    const destInput = document.getElementById('destinationSearch'), suggestionsDiv = document.getElementById('destSuggestions');
    destInput.addEventListener('input', e => {
      clearTimeout(destSearchTimeout);
      if (e.target.value.length < 3) { suggestionsDiv.innerHTML = ''; return; }
      destSearchTimeout = setTimeout(async () => {
        const list = await searchLocation(e.target.value);
        suggestionsDiv.innerHTML = '';
        if (!list.length) { suggestionsDiv.innerHTML = '<div class="suggestion-item">No locations in San Pablo</div>'; return; }
        list.forEach(s => {
          const d = document.createElement('div'); d.className = 'suggestion-item'; d.textContent = s.display_name;
          d.onclick = () => { destInput.value = s.display_name; selectedDest = { lat: parseFloat(s.lat), lng: parseFloat(s.lon), name: s.display_name }; suggestionsDiv.innerHTML = ''; };
          suggestionsDiv.appendChild(d);
        });
      }, 500);
    });
    document.getElementById('findRouteBtn').addEventListener('click', findRoute);
  });
</script>
</body>
</html>
