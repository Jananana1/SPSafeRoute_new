<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SP SafeRoute</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs for FCM -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
</head>
<body>

<div id="appLayout">
    <!-- Full Screen Map Background -->
    <div id="map"></div>

    <!-- Toggle Button for Sidebar (Visible when logged in and sidebar is collapsed) -->
    <div id="sidebarToggle" class="sidebar-toggle hidden">
        ☰
    </div>

    <!-- Top Right Controls (Visible when logged in) -->
    <div id="topRightControls" class="top-right-controls hidden">
        <div id="themeToggleBtn" class="control-btn" title="Toggle Theme">🌗</div>
        <div id="bellIcon" class="control-btn" title="Enable Notifications">🔔</div>
    </div>

    <!-- Sidebar Menu (Visible when logged in) -->
    <div id="sidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h2>SP SafeRoute</h2>
            <button id="closeSidebarBtn" class="close-btn">×</button>
        </div>
        
        <div class="user-info">
            <h3 id="userName">Welcome</h3>
            <p id="userEmail">user@example.com</p>
        </div>

        <div class="nav-menu">
            <a href="saferoute.html" class="nav-item">🛡️ Safe Route</a>
            <a href="report.html" class="nav-item">⚠️ Report Incident</a>
            <a href="activealerts.html" class="nav-item">📋 Active Alerts</a>
            <a href="backend/app/templates/admin_dashboard.html" class="nav-item hidden" id="adminBtn">👑 Admin</a>
            <a href="sos.html" class="nav-item danger">🆘 SOS Emergency</a>
        </div>

        <div class="sidebar-footer">
            <button id="logoutBtn" class="logout-btn">Log Out</button>
        </div>
    </div>

    <!-- Authentication Overlay (Visible when not logged in) -->
    <div id="authOverlay" class="auth-container">
        <!-- Login Panel -->
        <div id="loginPanel" class="glass-card">
            <h1 class="app-title">SP SafeRoute</h1>
            <input type="email" id="email" placeholder="Email" class="input">
            <input type="password" id="password" placeholder="Password" class="input">
            <button id="loginBtn" class="btn btn-primary">Login</button>
            <div class="link" id="showRegisterBtn">Don't have an account? Sign Up</div>
            <div id="loginMessage" class="error"></div>
        </div>

        <!-- Register Panel -->
        <div id="registerPanel" class="glass-card hidden">
            <h1 class="app-title">Create Account</h1>
            <input type="text" id="regName" placeholder="Full Name" class="input">
            <input type="email" id="regEmail" placeholder="Email" class="input">
            <input type="password" id="regPassword" placeholder="Password" class="input">
            <button id="registerBtn" class="btn btn-primary">Sign Up</button>
            <div class="link" id="showLoginBtn">Already have an account? Log In</div>
            <div id="registerMessage" class="error"></div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- Firebase and Map Initialization ---
    const firebaseConfig = {
        apiKey: "AIzaSyBv92XnzznnO-e7q-F7n8IqiyABvj2fhwU",
        authDomain: "spsaferoute.firebaseapp.com",
        projectId: "spsaferoute",
        storageBucket: "spsaferoute.firebasestorage.app",
        messagingSenderId: "328821048277",
        appId: "1:328821048277:web:e5ea508b9b90180ec0b35c"
    };
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .catch(err => console.error('Service Worker registration failed:', err));
    }

    let map;
    let darkTileLayer;
    let lightTileLayer;
    let currentTileLayer;

    // Theme initialization (force light default unless specifically saved as dark)
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        if (newTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        localStorage.setItem('theme', newTheme);
        updateMapTheme(newTheme);
    });

    function initMap() {
        if (!map) {
            map = L.map('map', { zoomControl: false }).setView([14.07, 121.3255], 13);
            
            darkTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            });

            lightTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            });

            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            currentTileLayer = currentTheme === 'dark' ? darkTileLayer : lightTileLayer;
            currentTileLayer.addTo(map);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }
    }

    function updateMapTheme(theme) {
        if (!map) return;
        map.removeLayer(currentTileLayer);
        currentTileLayer = theme === 'dark' ? darkTileLayer : lightTileLayer;
        currentTileLayer.addTo(map);
    }

    async function loadIncidentsOnMap() {
        if (!map) return;
        try {
            const res = await fetch('/incidents/', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
            const incidents = await res.json();
            if (res.ok) {
                incidents.forEach(inc => {
                    let color = inc.type === 'accident' ? '#ef4444' : inc.type === 'crime' ? '#a855f7' : '#f59e0b';
                    L.circleMarker([inc.lat, inc.lng], {
                        radius: 8,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup(`<b>${inc.type.toUpperCase()}</b><br>${inc.description}`);
                });
            }
        } catch (e) { console.error('Failed to load incidents', e); }
    }

    // --- UI Interactions ---
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const authOverlay = document.getElementById('authOverlay');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');

    document.getElementById('sidebarToggle').addEventListener('click', () => {
        sidebar.classList.remove('collapsed');
        sidebarToggle.classList.add('hidden-toggle');
    });

    document.getElementById('closeSidebarBtn').addEventListener('click', () => {
        sidebar.classList.add('collapsed');
        sidebarToggle.classList.remove('hidden-toggle');
    });

    document.getElementById('showRegisterBtn').addEventListener('click', () => {
        loginPanel.classList.add('hidden');
        registerPanel.classList.remove('hidden');
    });

    document.getElementById('showLoginBtn').addEventListener('click', () => {
        registerPanel.classList.add('hidden');
        loginPanel.classList.remove('hidden');
    });

    // --- Auth Logic ---
    let TOKEN = localStorage.getItem('token');

    function setToken(token) {
        TOKEN = token;
        if (token) localStorage.setItem('token', token);
        else localStorage.removeItem('token');
    }

    async function loadUser() {
        try {
            const response = await fetch('/users/me', {
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            const user = await response.json();
            if (!response.ok) throw new Error('Failed to load user');
            
            document.getElementById('userName').innerText = user.full_name || 'User';
            document.getElementById('userEmail').innerText = user.email || '';
            if (user.is_admin) {
                document.getElementById('adminBtn').classList.remove('hidden');
            }
            return user;
        } catch (e) { logout(); return null; }
    }

    function showMainApp() {
        authOverlay.classList.add('hidden');
        sidebar.classList.remove('hidden');
        sidebarToggle.classList.remove('hidden');
        document.getElementById('topRightControls').classList.remove('hidden');
        sidebar.classList.remove('collapsed'); // Open sidebar by default on login
        sidebarToggle.classList.add('hidden-toggle');
        initMap();
        setTimeout(() => map.invalidateSize(), 100);
        loadIncidentsOnMap();
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const params = new URLSearchParams();
            params.append('username', email);
            params.append('password', password);
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail);
            setToken(data.access_token);
            const user = await loadUser();
            if (user && user.is_admin) {
                window.location.href = 'backend/app/templates/admin_dashboard.html';
            } else {
                showMainApp();
            }
        } catch (err) {
            document.getElementById('loginMessage').innerText = err.message;
        }
    }

    async function register() {
        const full_name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, full_name })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail);
            setToken(data.access_token);
            const user = await loadUser();
            if (user && user.is_admin) {
                window.location.href = 'backend/app/templates/admin_dashboard.html';
            } else {
                showMainApp();
            }
        } catch (err) {
            document.getElementById('registerMessage').innerText = err.message;
        }
    }

    function logout() {
        setToken(null);
        sidebar.classList.add('hidden');
        sidebarToggle.classList.add('hidden');
        document.getElementById('topRightControls').classList.add('hidden');
        authOverlay.classList.remove('hidden');
        loginPanel.classList.remove('hidden');
        registerPanel.classList.add('hidden');
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('registerBtn').addEventListener('click', register);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // Initial state check
    if (TOKEN) {
        initMap();
        loadUser().then((user) => {
            if (user && user.is_admin) {
                window.location.href = 'backend/app/templates/admin_dashboard.html';
            } else {
                showMainApp();
            }
        }).catch(() => logout());
    } else {
        // Initialize map in background for visual effect behind auth panel
        initMap();
    }

    // --- Push Notifications ---
    document.getElementById('bellIcon').addEventListener('click', async () => {
        if (!TOKEN) return;
        try {
            await navigator.serviceWorker.ready;
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') throw new Error('Permission denied');
            const token = await messaging.getToken({ 
                vapidKey: "BKnT_hLfIL2DlonLwZrXY4kwjBEjlp6BaJIr6_ESnVT_K4R985hNmpftY7A9YA9HWSNjCNEeEcTuN8v6VBFDHeI" 
            });
            const response = await fetch('/user/fcm-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                body: JSON.stringify({ token: token })
            });
            if (response.ok) alert("✅ Notifications enabled!");
        } catch (err) {
            alert("❌ Could not enable notifications.");
        }
    });

</script>
</body>
</html>
