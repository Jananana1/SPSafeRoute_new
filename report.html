<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SP SafeRoute - Report Incident</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Reset & base variables */
    :root {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --danger: #ef4444;
      --success: #10b981;
      --glass-bg: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(0, 0, 0, 0.1);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --nav-hover: rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --glass-bg: rgba(17, 24, 39, 0.95);
      --glass-border: rgba(55, 65, 81, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --nav-hover: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      color: var(--text-main);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .report-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      pointer-events: auto;
    }

    .header-panel {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--primary);
      color: white;
    }

    .suggestions-list {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      margin-top: -8px;
      margin-bottom: 12px;
      max-height: 200px;
      overflow-y: auto;
      backdrop-filter: blur(10px);
    }

    .suggestion-item {
      padding: 12px;
      border-bottom: 1px solid var(--glass-border);
      cursor: pointer;
      color: var(--text-main);
    }

    .suggestion-item:hover {
      background: var(--nav-hover);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .top-right-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
      color: var(--text-main);
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: var(--glass-bg);
      color: var(--text-main);
      font-size: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
    }

    .success {
      color: var(--success);
      font-size: 14px;
    }

    .image-preview {
      margin-top: 8px;
      margin-bottom: 12px;
      display: none;
      position: relative;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 12px;
      object-fit: cover;
    }

    .remove-image {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .collapsible-body {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      max-height: 900px;
      opacity: 1;
      margin-top: 0;
    }

    .collapsible-body.collapsed {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: -12px;
      border: none;
      pointer-events: none;
    }

    .collapse-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 24px;
      padding: 10px;
      min-width: 44px;
      min-height: 44px;
      line-height: 1;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .collapse-toggle:hover {
      background: var(--nav-hover);
    }

    .collapse-toggle.collapsed {
      transform: rotate(180deg);
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="top-right-controls">
    <div id="themeToggleBtn" class="control-btn" title="Toggle Theme">🌗</div>
  </div>

  <div class="report-overlay">
    <div class="glass-panel header-panel" style="justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="btn-back" onclick="location.href='index.html'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <h2 style="margin:0; font-size: 20px; color: var(--text-main);">Report Incident</h2>
      </div>
      <button class="collapse-toggle" id="reportCollapseBtn" title="Minimize panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
    </div>

    <div class="glass-panel collapsible-body" id="reportBody">
      <select id="incidentType" class="input">
        <option value="">Select Incident Type</option>
        <option value="accident">🚨 Accident</option>
        <option value="crime">🔪 Crime</option>
        <option value="hazard">⚠️ Hazard</option>
      </select>

      <textarea id="incidentDesc" placeholder="Describe what happened..." class="input"></textarea>

      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="locationSearch" placeholder="Search location (e.g., San Pablo Cathedral)" class="input"
          style="margin-bottom:0;">
        <button id="useCurrentLocationBtn" class="btn-back" title="Use Current Location"
          style="width: 50px; height: 50px; border-radius: 12px;">📍</button>
      </div>
      <div id="locationSuggestions" class="suggestions-list"></div>

      <label for="incidentImage"
        style="font-size: 14px; color: var(--text-main); margin-bottom: 4px; display: block;">Attach Image
        (Optional, Max 5MB)</label>
      <input type="file" id="incidentImage" accept="image/jpeg,image/png,image/jpg,image/gif" class="input" style="padding: 8px;">
      <div id="imagePreview" class="image-preview"></div>

      <button id="submitReportBtn" class="btn-primary" style="margin-top: 10px;">Submit Report</button>
      <div id="message" class="error" style="margin-top: 12px; text-align:center;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // COMPLETE VALIDATION FIX - Client and Server-side enforcement
    // ============================================================

    let TOKEN = localStorage.getItem('token');
    if (!TOKEN) location.href = 'index.html';

    // Constants
    const CITY_BOUNDS = { south: 14.0400, west: 121.2000, north: 14.1100, east: 121.3800 };
    const CITY_CENTER = { lat: 14.0700, lng: 121.3255 };
    const ALLOWED_INCIDENT_TYPES = ['accident', 'crime', 'hazard'];
    const MAX_IMAGE_SIZE_MB = 5;
    const MAX_IMAGE_SIZE_BYTES = MAX_IMAGE_SIZE_MB * 1024 * 1024;
    const ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/jpg', 'image/gif'];

    let map;
    let incidentDraggableMarker = null;
    let selectedLocation = null;
    let searchTimeout = null;
    let currentImageData = null;

    // Validation functions
    function validateIncidentType(type) {
      if (!type || type.trim() === '') {
        return { valid: false, error: 'Please select an incident type' };
      }
      if (!ALLOWED_INCIDENT_TYPES.includes(type.toLowerCase())) {
        return { valid: false, error: 'Invalid incident type selected' };
      }
      return { valid: true };
    }

    function validateDescription(description) {
      if (!description || description.trim() === '') {
        return { valid: false, error: 'Please provide a description of the incident' };
      }
      if (description.trim().length < 10) {
        return { valid: false, error: 'Description must be at least 10 characters long' };
      }
      if (description.trim().length > 1000) {
        return { valid: false, error: 'Description cannot exceed 1000 characters' };
      }
      // Check for potentially malicious content
      const suspiciousPatterns = /<script|javascript:|onclick|onerror|alert\(|eval\(/i;
      if (suspiciousPatterns.test(description)) {
        return { valid: false, error: 'Description contains invalid content' };
      }
      return { valid: true };
    }

    function validateLocation(location) {
      if (!location) {
        return { valid: false, error: 'Please select a location for the incident' };
      }
      if (typeof location.lat !== 'number' || typeof location.lng !== 'number' || isNaN(location.lat) || isNaN(location.lng)) {
        return { valid: false, error: 'Invalid location coordinates' };
      }
      if (!isWithinSanPablo(location.lat, location.lng)) {
        return { valid: false, error: 'Location must be within San Pablo City limits' };
      }
      if (!location.name || location.name.trim() === '') {
        return { valid: false, error: 'Location name is required' };
      }
      return { valid: true };
    }

    function validateImage(imageData) {
      if (!imageData) {
        return { valid: true }; // Image is optional
      }
      
      // Check file size
      if (imageData.length > MAX_IMAGE_SIZE_BYTES) {
        return { 
          valid: false, 
          error: `Image size exceeds ${MAX_IMAGE_SIZE_MB}MB limit. Please compress or choose a smaller image.` 
        };
      }
      
      // Check file format based on base64 header
      const mimeType = getMimeTypeFromBase64(imageData);
      if (!ALLOWED_IMAGE_TYPES.includes(mimeType)) {
        return { 
          valid: false, 
          error: 'Invalid image format. Please upload JPEG, PNG, or GIF images only.' 
        };
      }
      
      return { valid: true };
    }

    function getMimeTypeFromBase64(base64String) {
      const header = base64String.substring(0, 20);
      if (header.includes('/jpeg;') || header.includes('/jpg;')) return 'image/jpeg';
      if (header.includes('/png;')) return 'image/png';
      if (header.includes('/gif;')) return 'image/gif';
      return 'unknown';
    }

    function compressImage(base64Data, maxSizeMB = 1) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          // Scale down if too large
          const maxDimension = 1024;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = (height * maxDimension) / width;
              width = maxDimension;
            } else {
              width = (width * maxDimension) / height;
              height = maxDimension;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          let quality = 0.8;
          let compressed = canvas.toDataURL('image/jpeg', quality);
          
          // Adjust quality until size is acceptable or quality is too low
          while (compressed.length > maxSizeMB * 1024 * 1024 && quality > 0.3) {
            quality -= 0.1;
            compressed = canvas.toDataURL('image/jpeg', quality);
          }
          
          resolve(compressed);
        };
        img.src = base64Data;
      });
    }

    function isWithinSanPablo(lat, lng) {
      return lat >= CITY_BOUNDS.south && lat <= CITY_BOUNDS.north && 
             lng >= CITY_BOUNDS.west && lng <= CITY_BOUNDS.east;
    }

    // Image preview handler with validation
    document.getElementById('incidentImage').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      const previewDiv = document.getElementById('imagePreview');
      const msgBox = document.getElementById('message');

      if (file) {
        // Validate file type first
        if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
          msgBox.innerText = 'Invalid file type. Please upload JPEG, PNG, or GIF images only.';
          msgBox.style.color = 'var(--danger)';
          setTimeout(() => {
            if (msgBox.innerText.includes('Invalid file type')) msgBox.innerText = '';
          }, 3000);
          e.target.value = '';
          return;
        }

        // Validate file size
        if (file.size > MAX_IMAGE_SIZE_BYTES) {
          msgBox.innerText = `File too large. Maximum size is ${MAX_IMAGE_SIZE_MB}MB.`;
          msgBox.style.color = 'var(--danger)';
          setTimeout(() => {
            if (msgBox.innerText.includes('File too large')) msgBox.innerText = '';
          }, 3000);
          e.target.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = async function(event) {
          // Compress large images automatically
          let imageData = event.target.result;
          if (imageData.length > 2 * 1024 * 1024) { // If > 2MB, compress
            msgBox.innerText = 'Compressing image for optimal storage...';
            msgBox.style.color = 'var(--text-main)';
            imageData = await compressImage(imageData, 1);
            msgBox.innerText = '';
          }
          
          currentImageData = imageData;
          previewDiv.innerHTML = `
          <div style="position: relative;">
            <img src="${currentImageData}" alt="Preview">
            <button class="remove-image" onclick="removeImage()">×</button>
          </div>
        `;
          previewDiv.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        removeImage();
      }
    });

    window.removeImage = function() {
      currentImageData = null;
      document.getElementById('incidentImage').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('imagePreview').innerHTML = '';
    };

    async function reverseGeocode(lat, lng) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1&zoom=18&accept-language=en`;
        const response = await fetch(url, { headers: { 'User-Agent': 'SP-SafeRoute/1.0' } });
        const data = await response.json();
        if (data.display_name) {
          let name = data.display_name;
          name = name.replace(', Philippines', '');
          name = name.replace(/, \d{4}, /g, ', ');
          if (name.length > 80) name = name.substring(0, 77) + '...';
          return name;
        }
        return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      } catch (err) {
        console.error('Reverse geocoding error:', err);
        return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      }
    }

    async function updateMarkerCoordinate(lat, lng, locationName = null) {
      const exactLat = parseFloat(lat);
      const exactLng = parseFloat(lng);
      if (isNaN(exactLat) || isNaN(exactLng)) return;

      if (incidentDraggableMarker) {
        incidentDraggableMarker.setLatLng([exactLat, exactLng]);
      } else {
        incidentDraggableMarker = L.marker([exactLat, exactLng], { draggable: true, autoPan: true }).addTo(map);
        incidentDraggableMarker.bindTooltip("📍 Drag to adjust location", { permanent: true, direction: 'top' });

        incidentDraggableMarker.on('dragend', async (e) => {
          const pos = e.target.getLatLng();
          const newLat = pos.lat;
          const newLng = pos.lng;

          const msgDiv = document.getElementById('message');
          msgDiv.innerText = 'Getting exact location name...';
          msgDiv.style.color = 'var(--text-main)';

          const accurateName = await reverseGeocode(newLat, newLng);
          document.getElementById('locationSearch').value = accurateName;
          selectedLocation = { lat: newLat, lng: newLng, name: accurateName };

          if (!isWithinSanPablo(newLat, newLng)) {
            msgDiv.innerText = '⚠️ Warning: Location outside San Pablo City boundary.';
            msgDiv.style.color = 'var(--danger)';
            setTimeout(() => {
              if (msgDiv.innerText.includes('Warning')) msgDiv.innerText = '';
            }, 3000);
          } else {
            msgDiv.innerText = '✓ Location pinned accurately.';
            msgDiv.style.color = 'var(--success)';
            setTimeout(() => {
              if (msgDiv.innerText === '✓ Location pinned accurately.') msgDiv.innerText = '';
            }, 1500);
          }
        });
      }

      map.setView([exactLat, exactLng], 16);

      let finalName = locationName;
      if (!finalName) {
        finalName = await reverseGeocode(exactLat, exactLng);
      }

      selectedLocation = { lat: exactLat, lng: exactLng, name: finalName };
      document.getElementById('locationSearch').value = finalName;
    }

    async function loadIncidentMarkers() {
      try {
        const res = await fetch('/incidents/', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
        const incidents = await res.json();
        if (res.ok) {
          incidents.forEach(inc => {
            const status = (inc.status || '').toLowerCase();
            if (status === 'deleted') return;

            let fillColor, borderColor, fillOpacity;
            if (['completed', 'resolved', 'dismissed'].includes(status)) {
              fillColor = '#aaaaaa';
              borderColor = '#888888';
              fillOpacity = 0.55;
            } else {
              fillColor = inc.type === 'accident' ? '#ef4444' : inc.type === 'crime' ? '#8b5cf6' : '#f59e0b';
              borderColor = '#ffffff';
              fillOpacity = 0.8;
            }

            L.circleMarker([inc.lat, inc.lng], { radius: 6, color: borderColor, weight: 1, fillColor: fillColor, fillOpacity: fillOpacity }).addTo(map);
          });
        }
      } catch (e) { console.warn("Could not load markers", e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

      map = L.map('map', { zoomControl: false }).setView([CITY_CENTER.lat, CITY_CENTER.lng], 13);
      const tileUrl = savedTheme === 'dark'
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
      L.tileLayer(tileUrl, { id: 'map-tiles', attribution: '© OpenStreetMap CARTO', maxZoom: 20 }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      loadIncidentMarkers();

      map.on('click', async (e) => {
        const clickedLat = e.latlng.lat;
        const clickedLng = e.latlng.lng;
        if (!isWithinSanPablo(clickedLat, clickedLng)) {
          const msgDiv = document.getElementById('message');
          msgDiv.innerText = 'Location outside San Pablo City. Please choose a spot within the city limits.';
          msgDiv.style.color = 'var(--danger)';
          setTimeout(() => {
            if (msgDiv.innerText.includes('outside San Pablo')) msgDiv.innerText = '';
          }, 2500);
          return;
        }
        document.getElementById('message').innerText = '';
        const locationName = await reverseGeocode(clickedLat, clickedLng);
        await updateMarkerCoordinate(clickedLat, clickedLng, locationName);
      });
    });

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      if (newTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', newTheme);

      const newTileUrl = newTheme === 'dark'
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

      map.eachLayer(layer => {
        if (layer.options && layer.options.id === 'map-tiles') {
          layer.setUrl(newTileUrl);
        }
      });
    });

    const locationInput = document.getElementById('locationSearch');
    const suggestionsDiv = document.getElementById('locationSuggestions');

    locationInput.addEventListener('input', function(e) {
      clearTimeout(searchTimeout);
      const query = e.target.value;
      if (query.length < 3) { suggestionsDiv.innerHTML = ''; return; }
      searchTimeout = setTimeout(async () => {
        const viewbox = `${CITY_BOUNDS.west},${CITY_BOUNDS.south},${CITY_BOUNDS.east},${CITY_BOUNDS.north}`;
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ', San Pablo City, Laguna, Philippines')}&format=json&limit=5&viewbox=${viewbox}&bounded=1`;
        try {
          const res = await fetch(url, { headers: { 'User-Agent': 'SP-SafeRoute/1.0' } });
          const suggestions = await res.json();
          suggestionsDiv.innerHTML = '';
          if (suggestions.length === 0) {
            suggestionsDiv.innerHTML = '<div class="suggestion-item">No locations found in San Pablo City</div>';
            return;
          }
          suggestions.filter(item => isWithinSanPablo(parseFloat(item.lat), parseFloat(item.lon))).forEach(s => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.textContent = s.display_name;
            div.onclick = async () => {
              suggestionsDiv.innerHTML = '';
              const exactLat = parseFloat(s.lat);
              const exactLng = parseFloat(s.lon);
              await updateMarkerCoordinate(exactLat, exactLng, s.display_name);
              document.getElementById('message').innerText = '';
            };
            suggestionsDiv.appendChild(div);
          });
        } catch (err) { console.warn(err); }
      }, 500);
    });

    document.getElementById('useCurrentLocationBtn').addEventListener('click', async () => {
      if (!navigator.geolocation) return alert('Geolocation not supported');

      const msgBox = document.getElementById('message');
      msgBox.innerText = 'Getting your precise location...';
      msgBox.style.color = 'var(--text-main)';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        if (!isWithinSanPablo(latitude, longitude)) {
          msgBox.innerText = 'You are outside San Pablo City. Please select a location within the city.';
          msgBox.style.color = 'var(--danger)';
          return;
        }
        const locationName = await reverseGeocode(latitude, longitude);
        await updateMarkerCoordinate(latitude, longitude, locationName);
        msgBox.innerText = '✓ Location pinned accurately.';
        msgBox.style.color = 'var(--success)';
        setTimeout(() => { if (msgBox.innerText === '✓ Location pinned accurately.') msgBox.innerText = ''; }, 2000);
      }, (err) => {
        console.error('Geolocation error:', err);
        if (err.code === 1) {
          msgBox.innerText = 'Location access denied. Please enable location services.';
        } else {
          msgBox.innerText = 'Could not get your location. Please try again or search manually.';
        }
        msgBox.style.color = 'var(--danger)';
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });

    // Enhanced submit with complete validation
    document.getElementById('submitReportBtn').addEventListener('click', async () => {
      const type = document.getElementById('incidentType').value;
      const description = document.getElementById('incidentDesc').value;
      const msgBox = document.getElementById('message');

      // Validate incident type
      const typeValidation = validateIncidentType(type);
      if (!typeValidation.valid) {
        msgBox.innerText = typeValidation.error;
        msgBox.style.color = 'var(--danger)';
        return;
      }

      // Validate description
      const descValidation = validateDescription(description);
      if (!descValidation.valid) {
        msgBox.innerText = descValidation.error;
        msgBox.style.color = 'var(--danger)';
        return;
      }

      // Validate location
      if (incidentDraggableMarker) {
        const markerLatLng = incidentDraggableMarker.getLatLng();
        if (Math.abs(markerLatLng.lat - (selectedLocation?.lat || 0)) > 0.0000001 ||
            Math.abs(markerLatLng.lng - (selectedLocation?.lng || 0)) > 0.0000001) {
          selectedLocation = { 
            lat: markerLatLng.lat, 
            lng: markerLatLng.lng, 
            name: selectedLocation?.name || await reverseGeocode(markerLatLng.lat, markerLatLng.lng)
          };
        }
      }
      
      const locationValidation = validateLocation(selectedLocation);
      if (!locationValidation.valid) {
        msgBox.innerText = locationValidation.error;
        msgBox.style.color = 'var(--danger)';
        return;
      }

      // Validate image (if provided)
      const imageValidation = validateImage(currentImageData);
      if (!imageValidation.valid) {
        msgBox.innerText = imageValidation.error;
        msgBox.style.color = 'var(--danger)';
        return;
      }

      msgBox.style.color = 'var(--text-main)';
      msgBox.innerText = 'Submitting report...';

      // Prepare payload with proper validation
      const payload = {
        type: type.toLowerCase(),
        description: description.trim(),
        lat: parseFloat(selectedLocation.lat.toFixed(6)),
        lng: parseFloat(selectedLocation.lng.toFixed(6)),
        location_name: selectedLocation.name.trim(),
        image_url: currentImageData || null
      };

      console.log('Submitting payload:', { 
        ...payload, 
        image_url: payload.image_url ? '[IMAGE DATA - ' + payload.image_url.length + ' bytes]' : null 
      });

      try {
        const response = await fetch('/incidents/', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': `Bearer ${TOKEN}`
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errorMessage;
          try {
            const errorData = await response.json();
            errorMessage = errorData.detail || errorData.message || `Failed to report incident (HTTP ${response.status})`;
          } catch (e) {
            errorMessage = `Server error (HTTP ${response.status}). Please try again.`;
          }
          
          msgBox.style.color = 'var(--danger)';
          msgBox.innerText = errorMessage;
          console.error('Server response error:', errorMessage);
        } else {
          const responseData = await response.json();
          console.log('Success:', responseData);
          msgBox.style.color = 'var(--success)';
          msgBox.innerText = '✓ Incident reported successfully! Redirecting...';
          setTimeout(() => location.href = 'index.html', 1500);
        }
      } catch (error) {
        console.error('Network error:', error);
        msgBox.style.color = 'var(--danger)';
        msgBox.innerText = 'Network error. Please check your connection and try again.';
      }
    });

    window.addEventListener('load', () => {
      if (!selectedLocation && !incidentDraggableMarker) {
        const infoMsg = document.getElementById('message');
        infoMsg.innerText = '📍 Click on map, search, use current location, or drag marker to pin incident accurately.';
        infoMsg.style.color = 'var(--text-main)';
        setTimeout(() => {
          if (infoMsg.innerText === '📍 Click on map, search, use current location, or drag marker to pin incident accurately.') {
            infoMsg.innerText = '';
          }
        }, 4000);
      }
    });

    const reportCollapseBtn = document.getElementById('reportCollapseBtn');
    const reportBody = document.getElementById('reportBody');
    if (reportCollapseBtn && reportBody) {
      if (localStorage.getItem('report_collapsed') === 'true') {
        reportBody.classList.add('collapsed');
        reportCollapseBtn.classList.add('collapsed');
      }

      reportCollapseBtn.addEventListener('click', () => {
        const isCollapsed = reportBody.classList.toggle('collapsed');
        reportCollapseBtn.classList.toggle('collapsed', isCollapsed);
        localStorage.setItem('report_collapsed', isCollapsed);
      });
    }
  </script>
  <!-- Generic Alert Modal -->
  <div id="genericAlertModal" class="sidebar-overlay" style="z-index: 9999; align-items: center; justify-content: center; display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(5px);">
    <div class="glass-card" style="width: 90%; max-width: 400px; margin: 0; position: relative; background: var(--glass-bg, #fff); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
      <button onclick="document.getElementById('genericAlertModal').style.display='none'" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted, #666);">&times;</button>
      <h3 id="genericAlertTitle" style="color: var(--text-main, #333); margin-top: 0; margin-bottom: 10px; font-family: sans-serif;">Alert</h3>
      <p id="genericAlertBody" style="color: var(--text-muted, #666); font-size: 15px; line-height: 1.5; margin-bottom: 20px; white-space: pre-wrap; font-family: sans-serif;"></p>
      <button onclick="document.getElementById('genericAlertModal').style.display='none'" style="background: var(--primary, #3b82f6); color: white; padding: 12px; border-radius: 20px; width: 100%; font-weight: 600; cursor: pointer; border: none; font-size: 15px;">OK</button>
    </div>
  </div>
  <script>
    window.alert = function(message, title = "Notification") {
      document.getElementById('genericAlertTitle').innerText = title;
      document.getElementById('genericAlertBody').innerText = message;
      document.getElementById('genericAlertModal').style.display = 'flex';
    };
  </script>
</body>

</html>
