<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP SafeRoute - Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui; }
    .header { padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 16px; }
    .btn-back { background: none; border: none; font-size: 24px; cursor: pointer; color: #1A73E8; }
    h2 { margin: 0; font-size: 20px; }
    #map { height: 500px; width: 100%; background: #e0e0e0; }
  </style>
</head>
<body>
<div class="header">
  <button class="btn-back" onclick="location.href='index.html'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <h2>Map</h2>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API_BASE = '';
  let TOKEN = localStorage.getItem('token');

  function getHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': TOKEN ? `Bearer ${TOKEN}` : ''
    };
  }

  async function loadIncidents() {
    try {
      const response = await fetch(`${API_BASE}/incidents/`, { headers: getHeaders() });
      const incidents = await response.json();
      if (!response.ok) throw new Error(incidents.detail);
      return incidents;
    } catch (err) {
      console.error('Failed to load incidents:', err);
      return [];
    }
  }

  // Create map immediately
  var map = L.map('map').setView([14.07, 121.3255], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
  }).addTo(map);

  // Check auth and load incidents
  if (!TOKEN) {
    location.href = 'index.html';
  } else {
    loadIncidents().then(incidents => {
      incidents.forEach(inc => {
        const status = (inc.status || '').toLowerCase();
        if (status === 'deleted') return;

        let fillColor, borderColor, fillOpacity;
        if (['completed', 'resolved', 'dismissed'].includes(status)) {
            fillColor = '#aaaaaa';
            borderColor = '#888888';
            fillOpacity = 0.55;
        } else {
            fillColor = inc.type === 'accident' ? '#ef4444' : inc.type === 'crime' ? '#a855f7' : '#f59e0b';
            borderColor = '#ffffff';
            fillOpacity = 0.8;
        }

        L.circleMarker([inc.lat, inc.lng], {
            radius: 8,
            fillColor: fillColor,
            color: borderColor,
            weight: 2,
            opacity: 1,
            fillOpacity: fillOpacity
        }).addTo(map)
          .bindPopup(`<b>${inc.type.toUpperCase()}</b><br>${inc.description}${['completed', 'resolved', 'dismissed'].includes(status) ? '<br><i>(Resolved)</i>' : ''}`);
      });
    });
  }
</script>
</body>
</html>
