<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SP SafeRoute - Emergency SOS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { 
      display: flex; flex-direction: column; min-height: 100vh; margin: 0;
      background: radial-gradient(circle at center, var(--bg-main) 0%, #000 100%);
    }
    
    .fixed-header {
      position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
      padding: 20px; display: flex; align-items: center; gap: 16px;
    }
    
    .btn-back {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.2); }
    
    .container { 
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; text-align: center;
    }
    
    .sos-wrapper {
      position: relative;
      width: 250px; height: 250px;
      display: flex; justify-content: center; align-items: center;
    }
    
    .sos-pulse {
      position: absolute;
      width: 100%; height: 100%;
      background: rgba(220, 38, 38, 0.4);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    .sos-pulse:nth-child(2) { animation-delay: 0.5s; }
    .sos-pulse:nth-child(3) { animation-delay: 1s; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    
    .btn-danger-massive {
      position: relative; z-index: 10;
      width: 180px; height: 180px;
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      color: white; border: 4px solid #fca5a5;
      font-size: 48px; font-weight: 900; letter-spacing: 2px;
      border-radius: 50%; cursor: pointer;
      box-shadow: 0 10px 30px rgba(220, 38, 38, 0.5), inset 0 5px 15px rgba(255,255,255,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    
    .btn-danger-massive:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(220, 38, 38, 0.5), inset 0 10px 20px rgba(0,0,0,0.4);
    }
    
    .warning-text { color: #fca5a5; font-size: 16px; max-width: 300px; margin-top: 50px; line-height: 1.5; }
    
    .status-msg { margin-top: 20px; font-size: 18px; font-weight: bold; color: white; min-height: 24px; }
  </style>
</head>
<body>

<div class="fixed-header">
  <button class="btn-back" onclick="location.href='index.html'">←</button>
</div>

<div class="container">
  <div class="sos-wrapper">
    <div class="sos-pulse"></div>
    <div class="sos-pulse"></div>
    <div class="sos-pulse"></div>
    <button id="sendSOSBtn" class="btn-danger-massive">SOS</button>
  </div>
  
  <p class="warning-text">Press the button to instantly broadcast your live location to emergency contacts.</p>
  <div id="statusMsg" class="status-msg"></div>
</div>

<script>
  let TOKEN = localStorage.getItem('token');
  if (!TOKEN) location.href = 'index.html';
  
  // Force dark mode for SOS page to ensure contrast
  document.documentElement.setAttribute('data-theme', 'dark');

  async function sendSOS() {
    const statusMsg = document.getElementById('statusMsg');
    
    if (!navigator.geolocation) {
      statusMsg.style.color = '#fca5a5';
      statusMsg.innerText = 'Location services not supported.';
      return;
    }
    
    statusMsg.style.color = 'white';
    statusMsg.innerText = 'Acquiring GPS location...';
    
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      statusMsg.style.color = '#4ade80';
      statusMsg.innerText = 'Broadcasting Emergency Signal...';
      
      try {
        const res = await fetch('/sos/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
          body: JSON.stringify({ lat: latitude, lng: longitude })
        });
        
        if (res.ok) {
            statusMsg.innerText = 'SOS Broadcast Successful!';
            setTimeout(() => { alert(`Emergency Responders Notified. Location: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`); }, 500);
        } else {
            throw new Error();
        }
      } catch (err) {
        statusMsg.style.color = '#fca5a5';
        statusMsg.innerText = 'Network error. Please call emergency services directly.';
      }
    }, () => {
        statusMsg.style.color = '#fca5a5';
        statusMsg.innerText = 'Location access denied. Cannot send SOS.';
    });
  }

  document.getElementById('sendSOSBtn').addEventListener('click', sendSOS);
</script>
</body>
</html>
